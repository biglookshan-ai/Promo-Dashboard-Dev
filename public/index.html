<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="shopify-api-key" content="%%API_KEY%%" />
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js" data-api-key="%%API_KEY%%"></script>
  <title>网站更新中心</title>
  <!-- Banner 预览用主题同款字体(Instrument Sans / Urbanist / Figtree) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300&family=Instrument+Sans:wght@400;700&family=Urbanist:wght@400;500&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <ui-nav-menu>
    <a href="/" rel="home">网站更新中心</a>
  </ui-nav-menu>

  <main class="content">
    <header class="apphead">
      <div class="apphead__brand">
        <span class="apphead__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="m9 15 2 2 4-4"/></svg>
        </span>
        <div>
          <h1>网站更新中心</h1>
          <p class="apphead__sub">排期 · 审核 · 到点自动上下线</p>
        </div>
      </div>
      <div class="apphead__me" id="me-chip"></div>
    </header>

    <div class="demobar" id="demobar">
      <span class="demobar__tag">演示模式</span>
      <span>用的是你们<b>真实的 Banner 和顶栏内容</b>加示例活动;所有操作只存在你的浏览器里,<b>不会写入店铺</b>。</span>
      <button class="linkbtn" id="demo-reset" type="button">重置演示数据</button>
    </div>

    <nav class="modnav" id="modnav">
      <button class="modnav__item is-active" data-section="overview" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>总览</span>
      </button>
      <button class="modnav__item" data-section="preview" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3M2 8h20"/></svg><span>预览</span>
      </button>
      <button class="modnav__item" data-section="banners" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 8"/></svg><span>Banner</span>
      </button>
      <button class="modnav__item" data-section="topbar" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M3 13h18M3 17h12"/></svg><span>顶栏</span>
      </button>
      <button class="modnav__item" data-section="pmodules" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><path d="M3 16h18M3 20h12"/></svg><span>商品模块</span>
      </button>
      <button class="modnav__item" data-section="campaigns" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg><span>活动</span>
      </button>
      <button class="modnav__item" data-section="price" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span>改价</span>
      </button>
      <button class="modnav__item" data-section="reviews" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg><span>审核</span><span class="modnav__n modnav__n--alert" id="n-rv" hidden>0</span>
      </button>
      <button class="modnav__item" data-section="settings" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>设置</span>
      </button>
      <button class="modnav__item" data-section="metafields" data-group="metafields metaobjects promo detail" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg><span>工具</span>
      </button>
    </nav>

    <!-- 工具子导航:原有的元数据总账 / 促销盘点 -->
    <div class="toolnav" id="toolnav" hidden>
      <div class="toolnav__tabs">
        <button class="toolnav__item is-active" data-section="metafields" type="button">Metafield 字段 <span class="modnav__n" id="n-mf">—</span></button>
        <button class="toolnav__item" data-section="metaobjects" type="button">Metaobject 对象 <span class="modnav__n" id="n-mo">—</span></button>
        <button class="toolnav__item" data-section="promo" type="button">促销盘点</button>
      </div>
      <button id="reg-refresh" class="btn btn-sm" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>刷新总账
      </button>
    </div>
    <p id="reg-status" class="statusbar" hidden></p>

    <!-- ========== 排期系统(演示) ========== -->
    <section class="section is-active" id="section-overview"><div id="ov-root"></div></section>
    <section class="section" id="section-preview"><div id="pv-root"></div></section>
    <section class="section" id="section-banners"><div id="bn-root"></div></section>
    <section class="section" id="section-topbar"><div id="tb-root"></div></section>
    <section class="section" id="section-pmodules"><div id="pm-root"></div></section>
    <section class="section" id="section-campaigns"><div id="cp-root"></div></section>
    <section class="section" id="section-price"><div id="pr-root"><p class="muted">加载中…</p></div></section>
    <section class="section" id="section-reviews"><div id="rv-root"></div></section>
    <section class="section" id="section-settings"><div id="st-root"></div></section>

    <!-- ========== Metafield 模块 ========== -->
    <section class="section" id="section-metafields">
      <div class="stats" id="mf-stats"></div>
      <div class="toolbar">
        <div class="field-search">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="mf-search" placeholder="搜索名称 / namespace.key / 备注" />
        </div>
        <select id="mf-owner" class="sel"><option value="">全部资源</option></select>
        <select id="mf-source" class="sel"><option value="">全部来源</option></select>
        <select id="mf-usage" class="sel">
          <option value="">全部状态</option>
          <option value="hasdata">有数据</option>
          <option value="nodata">零数据</option>
          <option value="theme">主题在用</option>
          <option value="notheme">主题未引用</option>
          <option value="stale">疑似废弃</option>
          <option value="annotated">已标注</option>
        </select>
        <select id="mf-size" class="sel">
          <option value="25">每页 25</option>
          <option value="50">每页 50</option>
          <option value="100">每页 100</option>
        </select>
      </div>
      <div id="mf-list" class="cardlist"></div>
      <div id="mf-pager" class="pager"></div>
    </section>

    <!-- ========== Metaobject 模块 ========== -->
    <section class="section" id="section-metaobjects">
      <div class="stats" id="mo-stats"></div>
      <div class="toolbar">
        <div class="field-search">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="mo-search" placeholder="搜索名称 / type / 备注" />
        </div>
        <select id="mo-source" class="sel"><option value="">全部创建者</option></select>
        <select id="mo-usage" class="sel">
          <option value="">全部状态</option>
          <option value="hasdata">有条目</option>
          <option value="nodata">零条目</option>
          <option value="theme">主题在用</option>
          <option value="notheme">主题未引用</option>
          <option value="stale">疑似废弃</option>
          <option value="annotated">已标注</option>
        </select>
        <select id="mo-size" class="sel">
          <option value="25">每页 25</option>
          <option value="50">每页 50</option>
          <option value="100">每页 100</option>
        </select>
      </div>
      <div id="mo-list" class="cardlist"></div>
      <div id="mo-pager" class="pager"></div>
    </section>

    <!-- ========== 明细页 ========== -->
    <section class="section" id="section-detail">
      <button id="detail-back" class="btn btn-ghost btn-back" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        返回
      </button>
      <div class="dethead">
        <div>
          <h2 id="detail-title">明细</h2>
          <p class="mono muted" id="detail-sub"></p>
        </div>
        <div id="detail-actions"></div>
      </div>
      <div class="detgrid">
        <div class="detmain">
          <div id="detail-body"></div>
          <div id="detail-pager" class="pager"></div>
        </div>
        <aside class="detside"><div id="detail-info"></div></aside>
      </div>
    </section>

    <!-- ========== 促销盘点(原有模块) ========== -->
    <section class="section" id="section-promo">
      <div class="head">
        <div>
          <h2>促销数据盘点</h2>
          <p class="muted">扫描活动 / 促销 metaobject 与产品 metafield,核对迁移前的一致性问题。</p>
        </div>
        <button id="run" class="btn" type="button">刷新盘点</button>
      </div>

      <p id="status" class="muted"></p>
      <div id="result" hidden>
        <section class="cards" id="overview"></section>

        <nav class="tabs" id="tabs">
          <button class="tab is-active" data-tab="fixes" type="button">优先修复</button>
          <button class="tab" data-tab="catalog" type="button">种类目录</button>
          <button class="tab" data-tab="products" type="button">按产品</button>
        </nav>

        <section class="tabpane is-active" id="pane-fixes"><div id="fixes"></div></section>
        <section class="tabpane" id="pane-catalog"><div id="catalog"></div></section>
        <section class="tabpane" id="pane-products">
          <div class="prodfilter">
            <label><input type="checkbox" id="filter-expired" /> 只看已过期</label>
            <input type="search" id="prod-search" placeholder="搜索产品标题 / handle" />
            <span id="prod-count" class="muted"></span>
          </div>
          <div id="products" class="tablewrap"></div>
        </section>

        <details class="raw">
          <summary>原始条目表（活动 / 促销）</summary>
          <h3>活动 / 体验条目</h3>
          <div id="act-table" class="tablewrap"></div>
          <h3>促销条目</h3>
          <div id="promo-table" class="tablewrap"></div>
        </details>
      </div>
    </section>
  </main>

  <div class="drawer-mask" id="drawer-mask" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"></aside>

  <div id="toast" class="toast" hidden></div>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="registry.js"></script>
  <script src="schedule.js"></script>
  <script type="module" src="price.js"></script>
</body>
</html>
